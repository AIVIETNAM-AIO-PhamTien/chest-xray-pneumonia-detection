# Protocol A — see src/splits.py for what this changes.
seed: 42

data:
  root_dir: "data/raw"          # searched recursively; override with --root-dir
  image_size: 224
  batch_size: 32
  num_workers: 2
  protocol: "a_paper_compatible"
  val_fraction: 0.15

model:
  name: "resnet18"
  pretrained: true
  num_classes: 2
  freeze_backbone: false
  params: {}

train:
  epochs: 15
  lr: 0.0001
  weight_decay: 0.00001
  optimizer: "adam"
  device: "cuda"
  scheduler: "plateau"
  scheduler_params: {mode: "max", factor: 0.3, patience: 2}
  class_weights: "balanced"
  early_stopping_patience: 5

output:
  checkpoint_dir: "models"
  log_dir: "outputs/logs"
  run_name: "resnet18_a"
  wandb_project: "chest-xray-pneumonia"
  wandb_entity: null
  wandb_mode: "disabled"
