[tool.black]
line-length = 88

[tool.isort]
# Must match black, otherwise `black` and `isort` rewrite each other's output
# and the pre-commit sequence in README.md never converges.
profile = "black"
line_length = 88

# pytest config lives in pytest.ini (pytest reads that in preference to this
# section if both exist, so keeping both here and there is dead weight).
